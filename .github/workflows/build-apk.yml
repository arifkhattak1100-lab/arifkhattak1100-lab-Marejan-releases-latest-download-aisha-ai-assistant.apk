name: Build and Release Aisha APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create default environment properties
        run: |
          touch .env
          echo "GEMINI_API_KEY=\"\"" >> .env
          echo "ELEVENLABS_API_KEY=\"\"" >> .env

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK binary
        run: cp app/build/outputs/apk/debug/app-debug.apk aisha-ai-assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisha-ai-assistant-apk
          path: aisha-ai-assistant.apk
          retention-days: 30

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: aisha-ai-assistant.apk
          name: Aisha AI Voice Assistant Release
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
